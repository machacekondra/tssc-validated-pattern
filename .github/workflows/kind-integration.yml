name: Kind Integration Test Bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap Kind and Tekton
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Kind and kubectl
        run: make kind-integration-install-tools

      - name: Bootstrap cluster and Tekton
        run: make kind-integration-bootstrap

      - name: Delete Kind cluster
        if: always()
        run: make kind-integration-down
